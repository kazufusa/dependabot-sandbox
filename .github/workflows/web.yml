name: web
on:
  pull_request:
    paths:
      - "web/**"
      - "web-fromuv/**"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "web-fromuv/**"
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/api
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
      - name: Read versions from Dockerfile
        id: ver
        working-directory: .
        run: |
          {
            echo "python=$(sed -nE 's/^FROM python:([0-9.]+).*/\1/p' web/Dockerfile | head -1)"
            echo "node=$(sed -nE 's/^FROM node:([0-9.]+).*/\1/p' web/Dockerfile | head -1)"
            echo "uv=$(sed -nE 's#^FROM ghcr.io/astral-sh/uv:([0-9.]+).*#\1#p' web-fromuv/Dockerfile | head -1)"
          } >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          version: ${{ steps.ver.outputs.uv }}
          python-version: ${{ steps.ver.outputs.python }}
      - name: Check version files against Dockerfile
        working-directory: .
        env:
          PYTHON: ${{ steps.ver.outputs.python }}
          NODE: ${{ steps.ver.outputs.node }}
        run: |
          test "$(echo "$PYTHON" | cut -d. -f1,2)" = "$(cat web/api/.python-version)"
          test "$(echo "$NODE" | cut -d. -f1)" = "$(cat web/ui/.node-version)"
      - run: uv sync --locked
      - run: uv run python -c "import api"
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
      - name: Read versions from Dockerfile
        id: ver
        working-directory: .
        run: |
          {
            echo "python=$(sed -nE 's/^FROM python:([0-9.]+).*/\1/p' web/Dockerfile | head -1)"
            echo "node=$(sed -nE 's/^FROM node:([0-9.]+).*/\1/p' web/Dockerfile | head -1)"
            echo "uv=$(sed -nE 's#^FROM ghcr.io/astral-sh/uv:([0-9.]+).*#\1#p' web-fromuv/Dockerfile | head -1)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ steps.ver.outputs.node }}
      - name: Check version files against Dockerfile
        working-directory: .
        env:
          PYTHON: ${{ steps.ver.outputs.python }}
          NODE: ${{ steps.ver.outputs.node }}
        run: |
          test "$(echo "$PYTHON" | cut -d. -f1,2)" = "$(cat web/api/.python-version)"
          test "$(echo "$NODE" | cut -d. -f1)" = "$(cat web/ui/.node-version)"
      - run: npm ci
      - run: npm run check

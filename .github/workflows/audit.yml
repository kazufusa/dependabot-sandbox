name: audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked --all-packages
      - run: uv run pip-audit
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run gitleaks at the version pinned in Dockerfile
        run: |
          image="$(sed -nE 's/^FROM (ghcr.io\/gitleaks\/gitleaks:[^ ]+).*/\1/p' tools/gitleaks/Dockerfile | head -1)"
          docker run --rm -v "$PWD:/repo" "$image" dir /repo

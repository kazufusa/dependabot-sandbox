name: terraform-version
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      FILE: infra/terraform/versions.tf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bump required_version
        run: |
          latest="$(gh api repos/hashicorp/terraform/releases/latest --jq '.tag_name' | sed 's/^v//')"
          current="$(sed -nE 's/.*required_version = ">= ([0-9.]+)".*/\1/p' "$FILE")"
          echo "current=$current latest=$latest"
          if [ "$latest" = "$current" ]; then exit 0; fi
          branch="terraform-version/$latest"
          if gh api "repos/$REPO/branches/$branch" >/dev/null 2>&1; then exit 0; fi
          sed -i -E "s/(required_version = \">= )[0-9.]+\"/\1$latest\"/" "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "deps(terraform): bump required_version to $latest"
          git push origin "$branch"
          gh pr create --repo "$REPO" --head "$branch" --base main \
            --title "deps(terraform): bump required_version to $latest" \
            --body "Bump Terraform from $current to $latest."

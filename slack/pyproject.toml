[project]
name = "slack-app"
version = "0.0.0"
requires-python = ">=3.14.0,<3.15"
dependencies = [
    "shared",
    "slack-bolt>=1.21,<2",
    "cachetools>=5.3,<6",
    "boto3>=1.40.0",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

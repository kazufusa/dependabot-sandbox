[project]
name = "api"
version = "0.0.0"
requires-python = ">=3.14.0,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "jinja2==3.1.6",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared"
version = "0.0.0"
requires-python = ">=3.14.0,<3.15"
dependencies = [
    "httpx>=0.27.0",
    "packaging>=26.3",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
